<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Lorenz Attractor Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="message-box" class="message-box"></div>

    <div class="control-panel">
        <h1 class="text-3xl font-bold text-center text-indigo-400 mb-2">Discrete Lorenz Explorer</h1>
        <p class="text-center text-gray-400 mb-6 text-sm">Visualizing the 3D Sinusoidal Map.</p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Parameter a:</label>
                <input type="number" id="paramA" value="0.015" step="0.001">
            </div>
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Parameter b:</label>
                <input type="number" id="paramB" value="0.79" step="0.01">
            </div>
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Parameter c:</label>
                <input type="number" id="paramC" value="0.9" step="0.01">
            </div>
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Iterations:</label>
                <input type="number" id="iterCount" value="20000" step="1000">
            </div>
        </div>

        <div class="flex gap-4 items-center flex-wrap">
            <button id="generateBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg font-bold transition-all">Generate Attractor</button>
            <button id="toggleModeBtn" class="toggle-btn">
                <span class="toggle-indicator"></span>
                <span id="toggleLabel">Lines</span>
            </button>
            <button id="toggleTwistBtn" class="toggle-btn" title="Color by Twist (Torsion)">
                <span class="toggle-indicator"></span>
                <span>Twist Mode</span>
            </button>
            <button id="clearBtn" class="px-6 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition-all">Clear</button>
        </div>

        <div class="flex gap-4 items-end flex-wrap mt-4 pt-4 border-t border-slate-600">
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Export Resolution:</label>
                <select id="exportScale" class="bg-slate-700 border border-slate-500 text-white px-3 py-2 rounded-lg text-sm">
                    <option value="2">2× — Screen</option>
                    <option value="4" selected>4× — Journal</option>
                    <option value="6">6× — Print</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-gray-400 text-xs font-bold mb-1">Background:</label>
                <select id="exportBg" class="bg-slate-700 border border-slate-500 text-white px-3 py-2 rounded-lg text-sm">
                    <option value="#000000" selected>Black</option>
                    <option value="#ffffff">White</option>
                    <option value="transparent">Transparent</option>
                </select>
            </div>
            <button id="exportBtn" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white py-2 px-6 rounded-lg font-bold transition-all flex items-center justify-center gap-2">
                Export Image
            </button>
        </div>
    </div>

    <canvas id="lorenzCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, attractorObject, axesHelper;
        let lineState = true, twistMode = false;

        const generateLorenzPath = (a, b, c, iterations) => {
            let x = 0.1, y = 0.1, z = 0.1;
            const points = [], colors = [];
            const colorStart = new THREE.Color(0x6366f1), colorEnd = new THREE.Color(0x22d3ee);
            const twistColorPos = new THREE.Color(0xe69f00), twistColorNeg = new THREE.Color(0x0072b2);

            for (let i = 0; i < iterations; i++) {
                let nextX = y;
                let nextY = Math.sin(z);
                let nextZ = a + (b * x) + (c * y) - Math.sin(z * z);
                x = nextX; y = nextY; z = nextZ;
                points.push(new THREE.Vector3(x * 25, y * 25, z * 25));

                if (twistMode && points.length > 3) {
                    const v1 = new THREE.Vector3().subVectors(points[i], points[i-1]);
                    const v2 = new THREE.Vector3().subVectors(points[i-1], points[i-2]);
                    const v3 = new THREE.Vector3().subVectors(points[i-2], points[i-3]);
                    const torsion = new THREE.Vector3().crossVectors(v1, v2).dot(v3);
                    const vColor = new THREE.Color().copy(twistColorNeg).lerp(twistColorPos, (Math.tanh(torsion * 50) + 1) / 2);
                    colors.push(vColor.r, vColor.g, vColor.b);
                } else {
                    const vColor = new THREE.Color().copy(colorStart).lerp(colorEnd, i / iterations);
                    colors.push(vColor.r, vColor.g, vColor.b);
                }
            }
            return { points, colors };
        };

        function buildAttractorObject(data) {
            const geometry = new THREE.BufferGeometry().setFromPoints(data.points);
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(data.colors, 3));
            const mat = { vertexColors: true, transparent: true, opacity: 0.8 };
            return lineState ? new THREE.Line(geometry, new THREE.LineBasicMaterial(mat)) : new THREE.Points(geometry, new THREE.PointsMaterial({...mat, size: 0.15}));
        }

        function initThreeJS() {
            const canvas = document.getElementById('lorenzCanvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(30, 30, 30);
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
        }

        function renderAttractor() {
            const a = parseFloat(document.getElementById('paramA').value), b = parseFloat(document.getElementById('paramB').value), c = parseFloat(document.getElementById('paramC').value), iters = parseInt(document.getElementById('iterCount').value);
            if (attractorObject) { scene.remove(attractorObject); attractorObject.geometry.dispose(); attractorObject.material.dispose(); }
            const data = generateLorenzPath(a, b, c, iters);
            attractorObject = buildAttractorObject(data);
            scene.add(attractorObject);
        }

        function exportImage() {
            if (!attractorObject) return showMessage('Generate an attractor first.', 2000);
            const scale = parseInt(document.getElementById('exportScale').value), bg = document.getElementById('exportBg').value;
            const canvas = document.getElementById('lorenzCanvas'), w = canvas.clientWidth * scale, h = canvas.clientHeight * scale;
            const off = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: bg === 'transparent' });
            off.setSize(w, h);
            if (bg !== 'transparent') off.setClearColor(new THREE.Color(bg), 1);
            axesHelper.visible = false;
            off.render(scene, camera);
            axesHelper.visible = true;
            off.domElement.toBlob((blob) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `lorenz_export_${scale}x.png`;
                link.click();
                off.dispose();
            }, 'image/png');
        }

        function showMessage(t, d) { const b = document.getElementById('message-box'); b.textContent = t; b.style.display = 'block'; setTimeout(() => b.style.display = 'none', d); }

        window.onload = () => {
            initThreeJS();
            document.getElementById('generateBtn').onclick = renderAttractor;
            document.getElementById('exportBtn').onclick = exportImage;
            document.getElementById('toggleModeBtn').onclick = (e) => { lineState = !lineState; e.currentTarget.classList.toggle('active'); document.getElementById('toggleLabel').textContent = lineState ? 'Lines' : 'Points'; if (attractorObject) renderAttractor(); };
            document.getElementById('toggleTwistBtn').onclick = (e) => { twistMode = !twistMode; e.currentTarget.classList.toggle('active'); if (attractorObject) renderAttractor(); };
            document.getElementById('clearBtn').onclick = () => { if (attractorObject) { scene.remove(attractorObject); attractorObject = null; } };
            const animate = () => { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); };
            animate();
        };
    </script>
</body>
</html>
