<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuniLorenzViz | Sandbox Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0f172a; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .control-panel::-webkit-scrollbar { width: 4px; }
        .control-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    
    <div id="message-box" class="fixed top-4 right-4 z-50 bg-indigo-600 text-white px-4 py-2 rounded-lg shadow-lg hidden"></div>

    <div class="control-panel fixed top-0 left-0 h-full w-80 bg-slate-900/90 backdrop-blur-md border-r border-slate-700 p-6 overflow-y-auto z-40 shadow-2xl">
        <h1 class="text-2xl font-bold text-indigo-400 mb-1">MuniLorenzViz</h1>
        <p class="text-xs text-slate-400 mb-6 uppercase tracking-widest font-semibold">Free Mathematica Sandbox</p>

        <div class="space-y-4 mb-6">
            <h3 class="text-xs font-bold text-indigo-300 uppercase underline decoration-indigo-500/30">Vector Field Equations</h3>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">NEXT X (dx/dt)</label>
                <input type="text" id="formulaX" value="y" class="bg-slate-800 border border-slate-600 text-indigo-300 px-3 py-2 rounded-lg font-mono text-sm focus:border-indigo-500 outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">NEXT Y (dy/dt)</label>
                <input type="text" id="formulaY" value="Math.sin(z)" class="bg-slate-800 border border-slate-600 text-indigo-300 px-3 py-2 rounded-lg font-mono text-sm focus:border-indigo-500 outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">NEXT Z (dz/dt)</label>
                <input type="text" id="formulaZ" value="a + (b * x) + (c * y) - Math.sin(z * z)" class="bg-slate-800 border border-slate-600 text-indigo-300 px-3 py-2 rounded-lg font-mono text-sm focus:border-indigo-500 outline-none">
            </div>
        </div>

        <hr class="border-slate-700 mb-6">

        <div class="space-y-3 mb-6">
            <h3 class="text-xs font-bold text-indigo-300 uppercase underline decoration-indigo-500/30">Initial State (Seed)</h3>
            <div class="grid grid-cols-3 gap-2">
                <div class="flex flex-col">
                    <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">X0</label>
                    <input type="number" id="startX" value="0.1" step="0.1" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-xs">
                </div>
                <div class="flex flex-col">
                    <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">Y0</label>
                    <input type="number" id="startY" value="0.2" step="0.1" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-xs">
                </div>
                <div class="flex flex-col">
                    <label class="text-slate-500 text-[10px] font-bold mb-1 ml-1">Z0</label>
                    <input type="number" id="startZ" value="0.3" step="0.1" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-xs">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1">PARAM A</label>
                <input type="number" id="paramA" value="0.015" step="0.001" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-sm">
            </div>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1">PARAM B</label>
                <input type="number" id="paramB" value="0.79" step="0.01" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-sm">
            </div>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1">PARAM C</label>
                <input type="number" id="paramC" value="0.9" step="0.01" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-sm">
            </div>
            <div class="flex flex-col">
                <label class="text-slate-500 text-[10px] font-bold mb-1">ITERS (x1000)</label>
                <input type="number" id="iterCount" value="20000" step="5000" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded-md text-sm">
            </div>
        </div>

        <div class="space-y-3">
            <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-all active:scale-95">Generate Manifold</button>
            <div class="flex gap-2">
                <button id="toggleModeBtn" class="flex-1 bg-slate-800 border border-slate-700 text-[10px] py-2 rounded-lg hover:bg-slate-700 transition-colors">
                    Mode: <span id="toggleLabel" class="text-indigo-400">Lines</span>
                </button>
                <button id="toggleTwistBtn" class="flex-1 bg-slate-800 border border-slate-700 text-[10px] py-2 rounded-lg hover:bg-slate-700 transition-colors">
                    <span id="twistLabel" class="text-indigo-400">Twist Mode</span>
                </button>
            </div>
            <button id="clearBtn" class="w-full text-slate-500 hover:text-red-400 text-[10px] font-bold transition-colors">RESET WORKSPACE</button>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700 space-y-4">
            <h3 class="text-xs font-bold text-emerald-400 uppercase">Journal Export</h3>
            <div class="grid grid-cols-2 gap-2">
                <select id="exportScale" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded text-[10px]">
                    <option value="2">2× SCREEN</option>
                    <option value="4" selected>4× JOURNAL</option>
                    <option value="8">8× PRINT</option>
                </select>
                <select id="exportBg" class="bg-slate-800 border border-slate-700 text-white px-2 py-1.5 rounded text-[10px]">
                    <option value="#000000" selected>BLACK</option>
                    <option value="#ffffff">WHITE</option>
                </select>
            </div>
            <button id="exportBtn" class="w-full bg-emerald-700/20 hover:bg-emerald-700/40 text-emerald-400 border border-emerald-700/50 py-2 rounded-lg text-xs font-bold transition-all">
                DOWNLOAD HIGH-RES PNG
            </button>
        </div>
    </div>

    <canvas id="lorenzCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, attractorObject, axesHelper;
        let lineState = true, twistMode = false;

        const generateLorenzPath = (a, b, c, iterations) => {
            // 1. Pull dynamic starts from UI
            let x = parseFloat(document.getElementById('startX').value) || 0.1;
            let y = parseFloat(document.getElementById('startY').value) || 0.2;
            let z = parseFloat(document.getElementById('startZ').value) || 0.3;

            // 2. Pull formulas from UI
            const formulaX = document.getElementById('formulaX').value;
            const formulaY = document.getElementById('formulaY').value;
            const formulaZ = document.getElementById('formulaZ').value;

            // 3. Construct functions
            let getNextX, getNextY, getNextZ;
            try {
                getNextX = new Function('x', 'y', 'z', 'a', 'b', 'c', `return ${formulaX};`);
                getNextY = new Function('x', 'y', 'z', 'a', 'b', 'c', `return ${formulaY};`);
                getNextZ = new Function('x', 'y', 'z', 'a', 'b', 'c', `return ${formulaZ};`);
            } catch (err) {
                console.error("Syntax in formula box:", err);
                return { points: [], colors: [] };
            }

            const points = [], colors = [];
            const colorStart = new THREE.Color(0x6366f1), colorEnd = new THREE.Color(0x22d3ee);
            const twistColorPos = new THREE.Color(0xe69f00), twistColorNeg = new THREE.Color(0x0072b2);

            for (let i = 0; i < iterations; i++) {
                try {
                    let nextX = getNextX(x, y, z, a, b, c);
                    let nextY = getNextY(x, y, z, a, b, c);
                    let nextZ = getNextZ(x, y, z, a, b, c);
                    x = nextX; y = nextY; z = nextZ;

                    points.push(new THREE.Vector3(x * 25, y * 25, z * 25));

                    if (twistMode && i > 3) {
                        const v1 = new THREE.Vector3().subVectors(points[i], points[i-1]);
                        const v2 = new THREE.Vector3().subVectors(points[i-1], points[i-2]);
                        const v3 = new THREE.Vector3().subVectors(points[i-2], points[i-3]);
                        const torsion = new THREE.Vector3().crossVectors(v1, v2).dot(v3);
                        const vColor = new THREE.Color().copy(twistColorNeg).lerp(twistColorPos, (Math.tanh(torsion * 50) + 1) / 2);
                        colors.push(vColor.r, vColor.g, vColor.b);
                    } else {
                        const vColor = new THREE.Color().copy(colorStart).lerp(colorEnd, i / iterations);
                        colors.push(vColor.r, vColor.g, vColor.b);
                    }
                } catch(e) { break; }
            }
            return { points, colors };
        };

        function buildAttractorObject(data) {
            if (data.points.length === 0) return null;
            const geometry = new THREE.BufferGeometry().setFromPoints(data.points);
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(data.colors, 3));
            const mat = { vertexColors: true, transparent: true, opacity: 0.8 };
            return lineState ? new THREE.Line(geometry, new THREE.LineBasicMaterial(mat)) : new THREE.Points(geometry, new THREE.PointsMaterial({...mat, size: 0.15}));
        }

        function initThreeJS() {
            const canvas = document.getElementById('lorenzCanvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 2000);
            camera.position.set(50, 50, 50);
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            axesHelper = new THREE.AxesHelper(10);
            scene.add(axesHelper);
        }

        function renderAttractor() {
            const a = parseFloat(document.getElementById('paramA').value);
            const b = parseFloat(document.getElementById('paramB').value);
            const c = parseFloat(document.getElementById('paramC').value);
            const iters = parseInt(document.getElementById('iterCount').value);
            
            if (attractorObject) { 
                scene.remove(attractorObject); 
                attractorObject.geometry.dispose(); 
                attractorObject.material.dispose(); 
            }
            
            const data = generateLorenzPath(a, b, c, iters);
            attractorObject = buildAttractorObject(data);
            if (attractorObject) scene.add(attractorObject);
        }

        window.onload = () => {
            initThreeJS();
            document.getElementById('generateBtn').onclick = renderAttractor;
            document.getElementById('toggleModeBtn').onclick = () => { 
                lineState = !lineState; 
                document.getElementById('toggleLabel').textContent = lineState ? 'Lines' : 'Points'; 
                if (attractorObject) renderAttractor(); 
            };
            document.getElementById('toggleTwistBtn').onclick = (e) => { 
                twistMode = !twistMode; 
                e.currentTarget.classList.toggle('bg-indigo-900');
                if (attractorObject) renderAttractor(); 
            };
            document.getElementById('clearBtn').onclick = () => { if (attractorObject) scene.remove(attractorObject); attractorObject = null; };
            const animate = () => { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); };
            animate();
        };
    </script>
</body>
</html>
